name: CI
# Every job here must pass before a pull request can merge. The single required status check is "CI passed" (the last
# job), which fails if anything above it failed, was cancelled or was skipped when it should have run.
# Untrusted code (a contributor's component) only ever runs in jobs with a read-only token and no secrets.
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catches a plugin or Manim release that breaks a component
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MANIM_PACKAGES: >-
    ffmpeg libcairo2-dev libpango1.0-dev pkg-config
    texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm

jobs:
  static:
    name: Static checks
    # Seconds, no Manim, nothing executed: a bad contribution fails here before anything heavy is installed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11" }
      - name: No merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ':!*.md'; then
            echo "::error::Unresolved merge-conflict markers (above). Resolve them and push again."; exit 1
          fi
      - name: Community components pass the static safety and layout rules
        run: python scripts/check_community.py
      - name: Lint (syntax errors, undefined names, unused code in contributed files)
        run: |
          pip install -q ruff==0.17.6
          ruff check --select E9,F63,F7,F82,F811 --output-format github .
          ruff check --select F401,F841 --output-format github manimate/components/community tests/community scripts
      - name: Every Python file compiles
        run: python -m compileall -q manimate scripts tests

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Every action is pinned to a full commit SHA
        run: |
          if grep -rnE '^\s*(-\s*)?uses:\s*[^ #]+@' .github | grep -vE '@[0-9a-f]{40}(\s|$)'; then
            echo "::error::Pin each action to a 40-character commit SHA (with the version as a trailing comment). Dependabot keeps them current."
            exit 1
          fi
      - name: actionlint
        run: |
          set -euo pipefail
          v=1.7.7
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${v}/actionlint_${v}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/al.tgz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/al.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/al.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { python-version: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "${{ matrix.python-version }}", cache: pip, cache-dependency-path: "pyproject.toml" }
      - name: System packages for Manim
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086  # intentional: the package list is split into words
          sudo apt-get install -y --no-install-recommends $MANIM_PACKAGES
      - run: pip install -e ".[dev]"
      - run: ./scripts/install_plugins.sh   # every community Manim package the components wrap
      - name: Tests (a dry run of every component)
        run: pytest --strict-markers -ra
      - name: catalog.json and the generated docs are up to date
        # A component changes catalog.json, docs/LLM_PROMPT.md and the skill's catalog.md. Forgetting them is what broke main once.
        run: |
          python -m manimate.catalog --out catalog.json
          python scripts/gen_docs.py
          if [ -n "$(git status --porcelain)" ]; then
            git --no-pager diff --stat
            echo "::error::Generated files are out of date. Run: python -m manimate.catalog --out catalog.json && python scripts/gen_docs.py  (then commit the result)"
            exit 1
          fi

  render:
    name: Render new and changed components
    # Real video for every component a pull request adds or changes, attached so a reviewer can watch it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Which components changed?
        id: changed
        env: { BASE_SHA: "${{ github.event.pull_request.base.sha }}" }
        run: |
          names=$(git diff --name-only --diff-filter=AM "$BASE_SHA"...HEAD -- 'manimate/components/community/*.py' \
                  | xargs -r -n1 basename | sed 's/\.py$//' | grep -v '^_' | grep -v '^__init__$' | tr '\n' ' ' || true)
          echo "names=${names}" >> "$GITHUB_OUTPUT"
          echo "Changed components: ${names:-none}"
      - if: steps.changed.outputs.names != ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "pyproject.toml" }
      - if: steps.changed.outputs.names != ''
        name: Install
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086  # intentional: the package list is split into words
          sudo apt-get install -y --no-install-recommends $MANIM_PACKAGES
          pip install -e ".[dev]"
          ./scripts/install_plugins.sh
      - if: steps.changed.outputs.names != ''
        name: Render each one for real and check the video
        env: { NAMES: "${{ steps.changed.outputs.names }}" }
        run: |
          set -euo pipefail
          for name in $NAMES; do
            python -m manimate.preview "$name" --quality low --seconds 8
            f="previews/${name}.mp4"
            test -s "$f" || { echo "::error::No video was produced for ${name}"; exit 1; }
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            echo "${name}: ${d}s, $(stat -c %s "$f") bytes"
            python3 -c "import sys; sys.exit(0 if float('$d') >= 3 else 1)" || { echo "::error::${name} renders a video shorter than 3 seconds"; exit 1; }
          done
      - if: steps.changed.outputs.names != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: component-previews, path: previews/*.mp4, retention-days: 14 }

  package:
    name: Package builds and installs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "pyproject.toml" }
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev pkg-config ffmpeg
      - name: Build the wheel and import it from a clean environment
        run: |
          set -euo pipefail
          pip install -q build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install -q "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"   # away from the source tree, so only the installed package can be imported
          "$RUNNER_TEMP/clean/bin/python" - <<'PY'
          from manimate import registry
          from manimate.components import load_all
          load_all()
          names = {c.name for c in registry.all_components()}
          assert len(names) > 50, f"only {len(names)} components in the installed package"
          assert {"binary_heap", "sql_join"} <= names, "community components are missing from the wheel"
          print(f"{len(names)} components in the installed wheel")
          PY
          "$RUNNER_TEMP/clean/bin/manimate-catalog" > /dev/null

  slow:
    # Real renders of the slow-marked tests (minutes). Skipped on pull requests to keep them quick; runs on main and weekly.
    if: github.event_name != 'pull_request'
    name: Slow renders
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "pyproject.toml" }
      - run: |
          sudo apt-get update
          # shellcheck disable=SC2086  # intentional: the package list is split into words
          sudo apt-get install -y --no-install-recommends $MANIM_PACKAGES
      - run: pip install -e ".[dev]"
      - run: ./scripts/install_plugins.sh
      - run: pytest -m slow --strict-markers -ra

  ci-passed:
    name: CI passed
    # The one check to require in branch protection. `if: always()` so it still runs (and fails) when a job above fails.
    if: always()
    needs: [static, workflows, test, render, package, slow]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded
        env: { NEEDS: "${{ toJSON(needs) }}" }
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {k: v["result"] for k, v in json.loads(os.environ["NEEDS"]).items()}
          may_skip = {"render", "slow"}          # each is skipped by design on some events
          bad = {k: r for k, r in results.items() if r != "success" and not (r == "skipped" and k in may_skip)}
          for k, r in results.items():
              print(f"{'ok ' if k not in bad else 'BAD'} {k}: {r}")
          sys.exit(1 if bad else 0)
          PY
