[project]
name = "manimater-components"
dynamic = ["version"]
description = "Tested, reusable Manim animation components for explainer videos: one JSON-driven library."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Bishrant Ghimire" }]
dependencies = ["manim>=0.19,<1.0", "pydantic>=2.6"]

[project.scripts]
manimate-preview = "manimate.preview:main"
manimate-catalog = "manimate.catalog:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/bishnt/manimater-components"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: renders real video with Manim (needs ffmpeg, Cairo, Pango)"]
addopts = "-m 'not slow'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["manimate*"]

[tool.setuptools.dynamic]
version = { attr = "manimate.__version__" }
